name: Build Daily Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter project
        run: |
          echo "Checking Flutter project..."
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/app.dart
          test -f lib/screens/home_screen.dart
          test -f lib/theme/app_theme.dart
          echo "All required files found."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-aab
          path: build/app/outputs/bundle/release/app-release.aab
