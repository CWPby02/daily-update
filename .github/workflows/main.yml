name: Build Daily Update

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter project
        run: |
          flutter create \
            --org com.dailyupdate \
            --project-name mill \
            --platforms android \
            .

      - name: Verify Firebase configuration
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: google-services.json not found"
            exit 1
          fi

          echo "Firebase configuration found."

      - name: Configure Google Services plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")

          if settings.exists():
              text = settings.read_text()

              if "com.google.gms.google-services" not in text:
                  text = text.replace(
                      "plugins {",
                      "plugins {\n    id(\"com.google.gms.google-services\") version \"4.4.4\" apply false",
                      1
                  )

                  settings.write_text(text)

          build_gradle = Path("android/app/build.gradle.kts")

          if build_gradle.exists():
              text = build_gradle.read_text()

              if "com.google.gms.google-services" not in text:
                  text = text.replace(
                      "plugins {",
                      "plugins {\n    id(\"com.google.gms.google-services\")",
                      1
                  )

                  build_gradle.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Remove default Flutter test
        run: |
          rm -f test/widget_test.dart

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-aab
          path: build/app/outputs/bundle/release/app-release.aab
